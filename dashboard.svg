<text x="24" y="1066" font-size="13" fill="#151819">Most of what I make is open source. Found a bug or want a feature? Open an issue or send a PR, I&#x27;m happy</text>
<text x="24" y="1084" font-size="13" fill="#151819">to help. If something here saved you time, a star means a lot, or you can buy me a coffee at</text>
<text x="24" y="1102" font-size="13" fill="#151819">buymeacoffee.com/jchin14. And if you&#x27;re hiring for embedded, RF or comms, let&#x27;s chat!</text>
